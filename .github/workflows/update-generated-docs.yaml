name: Update Generated Documentation

on:
#  schedule:
#    # Run daily at 2 AM UTC
#    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/generate_*'
      - 'tasks.d/generate.yaml'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          submodules: true
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap

      - name: Generate documentation
        run: |
          echo "Generating documentation..."
          make generate:update

      - name: Check for changes
        id: check-changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet content/docs/; then
            echo "No changes detected"
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in documentation"
            echo "has-changes=true" >> $GITHUB_OUTPUT

            # Show what changed
            echo "Changed files:"
            git diff --name-only content/docs/

            # Show diff stats
            echo "Diff summary:"
            git diff --stat content/docs/
          fi

      - uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a #v2.1.0
        id: generate-token
        with:
          app_id: ${{ secrets.TOKEN_APP_ID }}
          private_key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check-changes.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725  # v8.0.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          signoff: true
          commit-message: |
            Update generated documentation
          title: "📚 Update generated documentation"
          body: |
            ## 🤖 Automated Documentation Update

            This PR contains automatic updates to the documentation generated from the latest tool container images.

            ⚡ This PR was automatically generated by the `update-generated-docs` workflow.
          branch: update-generated-docs-${{ github.run_number }}
          branch-suffix: timestamp
          labels: |
            documentation
            automated
          draft: false
          delete-branch: true
